<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Vibrant Neon Gradients matching Agency Theme -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8A23EA" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <linearGradient id="logo-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <linearGradient id="logo-grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- Subtle Glow Effects -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- LOGO ICON / ISOTYPE -->
    <g id="isotipo" transform="translate(20, 25)" filter="url(#icon-glow)">
      <!-- Outer Creative Dynamic Ring -->
      <path d="M 120 30 A 80 80 0 1 1 35 140" fill="none" stroke="url(#logo-grad-primary)" stroke-width="12" stroke-linecap="round" />
      
      <!-- Pen Tool Nib (Design Component) -->
      <g transform="translate(115, 10) rotate(25)">
        <path d="M 0 0 L 22 -35 L 44 0 L 32 30 L 12 30 Z" fill="url(#logo-grad-cyan)" />
        <circle cx="22" cy="-5" r="4" fill="#0D0F17" />
        <line x1="22" y1="-5" x2="22" y2="30" stroke="#0D0F17" stroke-width="2" />
      </g>

      <!-- Code Bracket < / > Symbol inside Core (Engineering Component) -->
      <path d="M 68 85 L 50 100 L 68 115" fill="none" stroke="#00E5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 112 85 L 130 100 L 112 115" fill="none" stroke="#FF2A85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="96" y1="80" x2="84" y2="120" stroke="url(#logo-grad-primary)" stroke-width="6" stroke-linecap="round" />

      <!-- Floating Sparkles (Creative Nodes) -->
      <circle cx="25" cy="65" r="5" fill="#00E5FF" />
      <circle cx="165" cy="150" r="7" fill="#FF2A85" />
      <circle cx="45" cy="175" r="4" fill="#8A23EA" />
    </g>

    <!-- LOGO TEXT / LOGOTYPE -->
    <g id="logotipo" transform="translate(230, 115)">
      <!-- Primary Brand Name -->
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">
        <tspan fill="#FFFFFF">CRIATIVA</tspan>
        <tspan fill="url(#logo-grad-primary)">WEB</tspan>
      </text>

      <!-- Sub-branding / Tagline -->
      <text x="5" y="38" fill="#94A3B8" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="9.5">
        AGÊNCIA DIGITAL
      </text>

      
    </g>
  </g>
</svg>
