<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Gradientes Neon Tech -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#8A23EA" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A23EA" />
      <stop offset="100%" stop-color="#4A00E0" />
    </linearGradient>

    <linearGradient id="grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68A063" />
      <stop offset="100%" stop-color="#3C873A" />
    </linearGradient>

    <!-- Gradiente do Card Branco / Glass Clean -->
    <linearGradient id="card-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Sombras Realistas 3D Otimizadas para Fundo Claro ou Escuro -->
    <filter id="soft-shadow-3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="glow-subtle-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- GRUPO PRINCIPAL -->
  <g transform="translate(80, 50)">

    <!-- SOMBRA DA BASE ISOMÉTRICA -->
    <ellipse cx="370" cy="550" rx="320" ry="35" fill="#00E5FF" opacity="0.1" filter="url(#glow-subtle-cyan)" />
    <ellipse cx="340" cy="540" rx="250" ry="25" fill="#8A23EA" opacity="0.12" filter="url(#glow-subtle-pink)" />

    <!-- 1. CARD PRINCIPAL BRANCO COM SOMBRA (Janela IDE / Layout About) -->
    <g transform="translate(40, 40) rotate(-2)" filter="url(#soft-shadow-3d)">
      <!-- Frame Branco do Card -->
      <rect x="0" y="0" width="540" height="380" rx="20" fill="url(#card-white)" stroke="#E2E8F0" stroke-width="2" />

      <!-- Top Bar da Janela -->
      <path d="M 0 20 A 20 20 0 0 1 20 0 L 520 0 A 20 20 0 0 1 540 20 L 540 45 L 0 45 Z" fill="#F1F5F9" />
      <line x1="0" y1="45" x2="540" y2="45" stroke="#E2E8F0" stroke-width="1" />

      <!-- Controles de Janela -->
      <circle cx="25" cy="22" r="5" fill="#FF5F56" />
      <circle cx="42" cy="22" r="5" fill="#FFBD2E" />
      <circle cx="59" cy="22" r="5" fill="#27C93F" />

      <!-- Tag de Arquitetura -->
      <rect x="160" y="12" width="220" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="270" y="27" fill="#475569" font-size="10" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ CriativaWeb.Engine — Full-Stack</text>

      <!-- Conteúdo Interno: Código Clean Code & UI/UX -->
      <!-- Bloco de Código (Lado Esquerdo) -->
      <rect x="30" y="70" width="230" height="270" rx="12" fill="#0F172A" />
      <g transform="translate(45, 90)" font-family="monospace" font-size="10">
        <text x="0" y="15" fill="#00E5FF">// Clean Architecture</text>
        <text x="0" y="35" fill="#FF2A85">class</text> <text x="42" y="35" fill="#FFFFFF">AgenciaWeb</text> {
        <text x="12" y="55" fill="#8A23EA">private</text> <text x="60" y="55" fill="#00E5FF">stack</text> = [
        <text x="24" y="73" fill="#FFBD2E">'Next.js 15'</text>,
        <text x="24" y="91" fill="#FFBD2E">'Node.js API'</text>,
        <text x="24" y="109" fill="#FFBD2E">'UI/UX Design'</text>
        <text x="12" y="127" fill="#00E5FF">]</text>;

        <text x="12" y="150" fill="#68A063">async</text> <text x="50" y="150" fill="#FFFFFF">deliver()</text> {
        <text x="24" y="170" fill="#FF2A85">return</text> <text x="70" y="170" fill="#00E5FF">true</text>;
        <text x="12" y="188" fill="#FFFFFF">}</text>
        <text x="0" y="210" fill="#FFFFFF">}</text>
      </g>

      <!-- Bloco UI/UX Prototype (Lado Direito) -->
      <rect x="280" y="70" width="230" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      
      <rect x="295" y="85" width="200" height="35" rx="8" fill="url(#grad-primary)" opacity="0.9" />
      <text x="310" y="106" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif">Design System UI/UX</text>

      <rect x="295" y="130" width="95" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="342" cy="165" r="18" fill="url(#grad-cyan)" />
      <rect x="310" y="195" width="65" height="8" rx="4" fill="#94A3B8" />

      <rect x="400" y="130" width="95" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="447" cy="165" r="18" fill="url(#grad-purple)" />
      <rect x="415" y="195" width="65" height="8" rx="4" fill="#94A3B8" />

      <!-- Métricas Otimizadas -->
      <rect x="295" y="230" width="200" height="95" rx="8" fill="#F1F5F9" />
      <text x="310" y="252" fill="#0F172A" font-size="10" font-weight="bold" font-family="sans-serif">PERFORMANCE &amp; SEO</text>
      <text x="310" y="280" fill="#00E5FF" font-size="22" font-weight="800" font-family="sans-serif">99.9%</text>
      <path d="M 390 285 L 420 265 L 445 275 L 480 250" fill="none" stroke="#68A063" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 2. CUBOS E BADGES FLUTUANTES EM 3D (Com Sombra e Destaque Neon) -->

    <!-- BADGE 1: CLEAN CODE (Topo Esquerda) -->
    <g transform="translate(10, 20) rotate(-6)" filter="url(#soft-shadow-3d)">
      <rect x="0" y="0" width="150" height="55" rx="14" fill="#FFFFFF" stroke="#00E5FF" stroke-width="2" />
      <circle cx="28" cy="27" r="12" fill="url(#grad-cyan)" />
      <text x="28" y="32" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">&lt;/&gt;</text>
      <text x="50" y="25" fill="#0F172A" font-size="11" font-weight="bold" font-family="sans-serif">Clean Code</text>
      <text x="50" y="40" fill="#64748B" font-size="9" font-family="sans-serif">Arquitetura SOLID</text>
    </g>

    <!-- BADGE 2: REACT / NEXT.JS (Direita Superior) -->
    <g transform="translate(540, 10) rotate(8)" filter="url(#soft-shadow-3d)">
      <rect x="0" y="0" width="160" height="60" rx="16" fill="#0F172A" stroke="#8A23EA" stroke-width="2" />
      <!-- Logo Atomico -->
      <ellipse cx="32" cy="30" rx="14" ry="5" fill="none" stroke="#00E5FF" stroke-width="2" />
      <ellipse cx="32" cy="30" rx="14" ry="5" fill="none" stroke="#00E5FF" stroke-width="2" transform="rotate(60, 32, 30)" />
      <ellipse cx="32" cy="30" rx="14" ry="5" fill="none" stroke="#00E5FF" stroke-width="2" transform="rotate(120, 32, 30)" />
      <text x="58" y="28" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">React 19</text>
      <text x="58" y="44" fill="#00E5FF" font-size="10" font-weight="bold" font-family="sans-serif">Next.js 15 App</text>
    </g>

    <!-- BADGE 3: NODE.JS API (Frente Baixo Esquerda) -->
    <g transform="translate(0, 420) rotate(5)" filter="url(#soft-shadow-3d)">
      <rect x="0" y="0" width="160" height="60" rx="14" fill="#FFFFFF" stroke="#68A063" stroke-width="2" />
      <rect x="15" y="15" width="30" height="30" rx="8" fill="url(#grad-node)" />
      <text x="30" y="35" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">⬡</text>
      <text x="55" y="28" fill="#0F172A" font-size="11" font-weight="bold" font-family="sans-serif">Node.js API</text>
      <text x="55" y="42" fill="#68A063" font-size="9" font-weight="bold" font-family="sans-serif">Fast &amp; Scalable</text>
    </g>

    <!-- BADGE 4: UI/UX DESIGN (Frente Baixo Direita) -->
    <g transform="translate(510, 410) rotate(-4)" filter="url(#soft-shadow-3d)">
      <rect x="0" y="0" width="170" height="65" rx="16" fill="url(#grad-primary)" />
      <!-- Pen Tool Icon -->
      <path d="M 22 42 L 25 32 L 35 22 C 37 20 40 20 42 22 C 44 24 44 27 42 29 L 32 39 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
      <text x="52" y="30" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">UI/UX Design</text>
      <text x="52" y="46" fill="#F8FAFC" font-size="10" font-family="sans-serif">Prototipagem Figma</text>
    </g>

    <!-- SPARKLES / FAÍSCAS NEON (Iluminação) -->
    <g opacity="0.9">
      <path d="M 230 10 L 233 18 L 241 21 L 233 24 L 230 32 L 227 24 L 219 21 L 227 18 Z" fill="#00E5FF" filter="url(#glow-subtle-cyan)" />
      <path d="M 500 480 L 502 486 L 508 488 L 502 490 L 500 496 L 498 490 L 492 488 L 498 486 Z" fill="#FF2A85" filter="url(#glow-subtle-pink)" />
      <circle cx="170" cy="480" r="4" fill="#00E5FF" />
      <circle cx="680" cy="180" r="5" fill="#8A23EA" />
    </g>

  </g>
</svg>
